<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fdfaf4;font-family:'Inter',-apple-system,sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.frame{position:relative;width:1200px;height:630px;padding:70px 90px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{color:#e87722;font-weight:600;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.02em;line-height:1.05;font-size:110px;color:#1a1a1a;margin-top:38px}
.rule{width:100px;height:5px;background:#e87722;margin:36px 0 28px 0;border-radius:2px}
.lead{color:#6b665c;font-size:26px;line-height:1.45;max-width:900px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;color:#6b665c;font-size:20px;font-weight:500}
.foot .brand{font-family:'Fraunces',Georgia,serif;color:#1a1a1a;font-size:22px;font-weight:600;letter-spacing:.01em}
.foot .url{color:#e87722;font-weight:600}
</style>
</head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">A short note from Jeff Eden</div>
    <h1>Point it. Scale it. Package it.</h1>
    <div class="rule"></div>
    <div class="lead">You already own a platform-shaped capability. Thirty minutes to talk about what that means for the rest of your year.</div>
  </div>
  <div class="foot">
    <div class="brand">EVEglyphDesign</div>
    <div class="url">eveglyphdesign.github.io/enterprise-agent-enablement</div>
  </div>
</div>
</body>
</html>
